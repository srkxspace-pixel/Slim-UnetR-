name: Verify portable MRI demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Check dependencies and tests
        run: |
          python -m pip check
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify model download and real 3D inference
        run: |
          python setup_demo.py
          python demo.py --device cpu --output-dir outputs/ci_demo
